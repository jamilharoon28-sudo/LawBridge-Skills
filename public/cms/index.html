<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LawBridge CMS</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      body {
        margin: 0;
        background: #f8f1e4;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "LawBridge CMS";
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 99999;
        padding: 10px 14px;
        border-radius: 999px;
        background: #061b31;
        color: #f8f1e4;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.03em;
        pointer-events: none;
        box-shadow: 0 16px 40px rgba(6, 27, 49, 0.2);
      }

      input,
      textarea,
      select {
        border-radius: 12px !important;
      }

      button,
      [role="button"] {
        border-radius: 999px !important;
      }
    </style>
  </head>

  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
