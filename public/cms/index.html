<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LawBridge CMS</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      :root {
        --lawbridge-navy: #061b31;
        --lawbridge-gold: #d39b45;
        --lawbridge-gold-light: #e7b65f;
        --lawbridge-cream: #f8f1e4;
        --lawbridge-soft: #fbf7ef;
        --lawbridge-text: #26384c;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top right, rgba(231, 182, 95, 0.18), transparent 34%),
          linear-gradient(180deg, var(--lawbridge-cream) 0%, var(--lawbridge-soft) 100%) !important;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      }

      body {
        padding-top: 86px;
      }

      .lawbridge-cms-bar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 999999;
        min-height: 74px;
        padding: 0 22px;
        background: rgba(6, 27, 49, 0.96);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        box-shadow: 0 18px 50px rgba(6, 27, 49, 0.22);
        backdrop-filter: blur(14px);
      }

      .lawbridge-cms-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .lawbridge-cms-logo {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: 0 0 auto;
      }

      .lawbridge-cms-logo img {
        width: 36px;
        height: 36px;
        object-fit: contain;
        display: block;
      }

      .lawbridge-cms-title {
        min-width: 0;
      }

      .lawbridge-cms-title strong {
        display: block;
        color: #ffffff;
        font-size: 1rem;
        line-height: 1.1;
        letter-spacing: 0.02em;
      }

      .lawbridge-cms-title span {
        display: block;
        margin-top: 3px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.82rem;
        line-height: 1.2;
      }

      .lawbridge-cms-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .lawbridge-cms-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 900;
        letter-spacing: 0.01em;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .lawbridge-cms-actions a:hover {
        transform: translateY(-1px);
      }

      .lawbridge-cms-actions .primary {
        background: linear-gradient(135deg, var(--lawbridge-gold-light), var(--lawbridge-gold));
        color: var(--lawbridge-navy);
        box-shadow: 0 12px 28px rgba(211, 155, 69, 0.28);
      }

      .lawbridge-cms-actions .secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      #nc-root,
      body > div:not(.lawbridge-cms-bar) {
        min-height: calc(100vh - 86px);
      }

      input,
      textarea,
      select {
        border-radius: 14px !important;
        border-color: rgba(6, 27, 49, 0.18) !important;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--lawbridge-gold) !important;
        box-shadow: 0 0 0 3px rgba(211, 155, 69, 0.14) !important;
      }

      button,
      [role="button"] {
        border-radius: 999px !important;
        font-weight: 800 !important;
      }

      a {
        color: var(--lawbridge-navy);
      }

      [class*="AppHeader"],
      [class*="Toolbar"],
      [class*="Sidebar"] {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      }

      [class*="Sidebar"] {
        background: #ffffff !important;
      }

      [class*="CollectionTop"],
      [class*="EditorContainer"],
      [class*="ControlPaneContainer"],
      [class*="CollectionMain"] {
        background: transparent !important;
      }

      [class*="Card"],
      [class*="ListCard"],
      [class*="EntryCard"],
      [class*="Control"] {
        border-radius: 18px !important;
      }

      @media (max-width: 760px) {
        body {
          padding-top: 124px;
        }

        .lawbridge-cms-bar {
          min-height: 110px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          padding: 14px 16px;
        }

        .lawbridge-cms-actions {
          width: 100%;
        }

        .lawbridge-cms-actions a {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>

  <body>
    <div class="lawbridge-cms-bar">
      <div class="lawbridge-cms-brand">
        <span class="lawbridge-cms-logo">
          <img src="/images/lawbridge-logo.png" alt="LawBridge" />
        </span>

        <div class="lawbridge-cms-title">
          <strong>LawBridge Content Manager</strong>
          <span>Edit website pages, resources, webinars, workshops and articles.</span>
        </div>
      </div>

      <nav class="lawbridge-cms-actions" aria-label="CMS shortcuts">
        <a href="/admin" class="secondary">Back to Admin</a>
        <a href="/" class="secondary" target="_blank">Preview Website</a>
        <a href="/cms/#/collections/pages" class="primary">Website Pages</a>
      </nav>
    </div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
